<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0cb69" />
      <stop offset="50%" stop-color="#d4a343" />
      <stop offset="100%" stop-color="#b8832a" />
    </linearGradient>
  </defs>
  <!-- Hexagon ring -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round" fill="none"/>
  <!-- Corner node atoms -->
  <circle cx="50" cy="15" r="7.5" fill="url(#gold)" />
  <circle cx="80" cy="32" r="7.5" fill="url(#gold)" />
  <circle cx="80" cy="68" r="7.5" fill="url(#gold)" />
  <circle cx="50" cy="85" r="7.5" fill="url(#gold)" />
  <circle cx="20" cy="68" r="7.5" fill="url(#gold)" />
  <circle cx="20" cy="32" r="7.5" fill="url(#gold)" />
  <!-- Inner molecular highlight facets -->
  <line x1="28" y1="36" x2="48" y2="24" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="28" y1="64" x2="48" y2="76" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="74" y1="42" x2="74" y2="58" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" />
</svg>
